<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>INFECTION — Zombie Survival</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- =========================================
         GAME CANVAS
         ========================================= -->

    <canvas id="game"></canvas>


    <!-- =========================================
         GAME HUD
         ========================================= -->

    <div id="ui">

        <b>INFECTION</b>

        <div>
            Mode:
            <span id="mode">HUMAN</span>
        </div>

        <div>
            Character:
            <span id="character">-</span>
        </div>

        <div>
            Health:
            <span id="health">100</span>
        </div>

        <div>
            Humans:
            <span id="humans">0</span>
        </div>

        <div>
            Zombies:
            <span id="zombies">0</span>
        </div>

        <br>

        <div>
            <strong>WASD</strong> — Move
        </div>

        <div>
            <strong>Mouse</strong> — Aim
        </div>

        <div>
            <strong>Click</strong> — Shoot
        </div>

        <div>
            <strong>TAB</strong> — Switch Character
        </div>

    </div>


    <!-- =========================================
         CHARACTER SWITCH INDICATOR
         ========================================= -->

    <div id="switchIndicator">
        TAB — SWITCH CHARACTER
    </div>


    <!-- =========================================
         CROSSHAIR
         ========================================= -->

    <div id="crosshair"></div>


    <!-- =========================================
         INFECTION WARNING
         ========================================= -->

    <div id="infectionWarning">
        YOU ARE INFECTED
    </div>


    <!-- =========================================
         DAMAGE FLASH
         ========================================= -->

    <div id="damageFlash"></div>


    <!-- =========================================
         GAME OVER SCREEN
         ========================================= -->

    <div id="message">

        <h1 id="result">
            GAME OVER
        </h1>

        <button onclick="location.reload()">
            PLAY AGAIN
        </button>

    </div>


    <!-- =========================================
         GAME JAVASCRIPT
         ========================================= -->

    <script src="game.js"></script>

</body>

</html>
